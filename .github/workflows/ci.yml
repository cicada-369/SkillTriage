name: ci

on:
  push:
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: test (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
      security-events: write
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12", "3.13", "3.14"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e '.[test]'
      - name: Compile
        run: python -m compileall -q -x '(^|/)tests/fixtures/' src tests tools
      - name: Test
        run: python -m unittest discover -s tests -t . -v
      - name: Rule catalog is current
        run: python tools/gen_rules_doc.py --check
      - name: CLI smoke test
        run: |
          python -m skilltriage --version
          python -m skilltriage rules list --format json > /dev/null
          python -m skilltriage audit examples/secure-skill --fail-on high
          python -m skilltriage audit examples/risky-skill --fail-on none --format sarif --output skilltriage.sarif
          python -m skilltriage scan examples/risky-skill --no-config --fail-on none -o report.html
          python -m skilltriage scan --root tests/fixtures/plugins --no-config --artifacts plugins --fail-on none --format json > /dev/null
      - name: Upload SARIF
        uses: github/codeql-action/upload-sarif@v3
        with:
          sarif_file: skilltriage.sarif
          category: skilltriage
      - name: Upload HTML report
        uses: actions/upload-artifact@v4
        with:
          name: skilltriage-html-${{ matrix.python-version }}
          path: report.html
          if-no-files-found: error

  security:
    name: security
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Install
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e '.[dev]'
      - name: Audit dependencies
        run: pip-audit --skip-editable
      - name: Static analysis of the tool itself
        run: bandit -q -r src
      - name: The tool passes its own secure example
        run: python -m skilltriage audit examples/secure-skill --no-config --fail-on high

  zipapp:
    name: zipapp
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Build
        run: make zipapp
      - name: Smoke test the archive
        run: |
          ./dist/skilltriage.pyz --version
          ./dist/skilltriage.pyz audit examples/secure-skill --fail-on high
          ./dist/skilltriage.pyz scan examples/risky-skill --no-config --fail-on none -o report.html
      - name: Record checksum
        run: sha256sum dist/skilltriage.pyz | tee dist/skilltriage.pyz.sha256
      - name: Upload archive
        uses: actions/upload-artifact@v4
        with:
          name: skilltriage-py
          path: |
            dist/skilltriage.pyz
            dist/skilltriage.pyz.sha256
